name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install --yes libglib2.0-bin zip unzip
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run checks
        run: npm run check
